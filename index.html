<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roleport 聚合整理 Web3 求职岗位，支持搜索、办公模式、薪资和职位类型筛选。">
  <meta name="theme-color" content="#f5f5f1">
  <title>Roleport · Web3 求职岗位</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('roleport-theme');
        const savedLanguage = localStorage.getItem('roleport-language');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.lang = savedLanguage === 'en' ? 'en' : 'zh';
        document.documentElement.lang = savedLanguage === 'en' ? 'en' : 'zh-CN';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.lang = 'zh';
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#job-list" data-i18n="skipToJobs">跳到岗位列表</a>

  <div class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Roleport">
        <svg class="brand-mark" width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
          <rect class="brand-mark-bg" x="0.5" y="0.5" width="37" height="37" rx="10.5"></rect>
          <circle cx="11.4" cy="12.2" r="2" fill="currentColor"></circle>
          <circle cx="11.4" cy="19" r="2" fill="currentColor"></circle>
          <circle cx="11.4" cy="25.8" r="2" fill="currentColor"></circle>
          <path d="M14 12.2 22 19M14 19h8M14 25.8 22 19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          <rect x="21.5" y="10.5" width="7" height="17" rx="3.5" fill="none" stroke="var(--accent)" stroke-width="2"></rect>
        </svg>
        <span class="brand-copy">
          <span class="brand-name">roleport</span>
          <span class="brand-tagline">WEB3 ROLE AGGREGATOR</span>
        </span>
      </a>

      <div class="top-actions">
        <div class="language-toggle" role="group" aria-label="语言 / Language">
          <span class="language-thumb" aria-hidden="true"></span>
          <button class="language-option is-active" type="button" data-language-option="zh" aria-pressed="true">中</button>
          <button class="language-option" type="button" data-language-option="en" aria-pressed="false">EN</button>
        </div>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色主题">
          <span class="theme-thumb" aria-hidden="true"></span>
          <span class="theme-icon sun-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"></circle>
              <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M12.95 3.05l-1.4 1.4M4.45 11.55l-1.4 1.4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"></path>
            </svg>
          </span>
          <span class="theme-icon moon-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.7 9.6A5.7 5.7 0 0 1 6.4 2.3a5.8 5.8 0 1 0 7.3 7.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <main>
      <section class="heading" aria-labelledby="page-title">
        <div>
          <div class="eyebrow"><span class="eyebrow-dot"></span>CURATED WEB3 OPPORTUNITIES</div>
          <h1 id="page-title" data-i18n="pageTitle">Web3 求职岗位</h1>
          <p class="subtitle" data-i18n="subtitle">聚合多个公开来源，查看岗位详情、公司信息与原始投递入口。</p>
        </div>
        <p class="updated" id="updatedAt">最近更新 · 今天</p>
      </section>

      <section class="panel" id="job-list" aria-labelledby="list-title">
        <h2 class="sr-only" id="list-title" data-i18n="listTitle">岗位列表</h2>

        <div class="toolbar">
          <div class="toolbar-top">
            <form class="search-form" id="searchForm" role="search">
              <label class="search-box" for="searchInput">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"></circle>
                  <path d="m10.4 10.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                </svg>
                <input id="searchInput" name="query" type="search" placeholder="搜索岗位或公司" autocomplete="off" aria-label="搜索岗位或公司" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
              </label>
              <button class="search-button" type="submit" data-i18n="search">搜索</button>
            </form>
            <p class="result-count" id="resultCount" aria-live="polite">共 <strong>0</strong> 个岗位</p>
          </div>

          <div class="filter-row">
            <label class="filter-select" for="workplaceFilter">
              <span class="sr-only" data-i18n="workplaceLabel">按办公模式筛选</span>
              <select id="workplaceFilter" name="workplace">
                <option value="all" data-i18n="workplaceAll">办公模式：全部</option>
                <option value="remote" data-i18n="remote">办公模式：远程</option>
                <option value="onsite" data-i18n="onsite">办公模式：实地</option>
              </select>
              <svg width="11" height="7" viewBox="0 0 11 7" fill="none" aria-hidden="true">
                <path d="m1 1 4.5 4.5L10 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </label>

            <label class="filter-select salary-filter" for="salaryFilter">
              <span class="sr-only" data-i18n="salaryLabel">按薪资筛选</span>
              <select id="salaryFilter" name="salary">
                <option value="all" data-i18n="salaryAll">薪资：不限</option>
                <option value="under-50k" data-i18n="salaryUnder50k">年薪：5 万美元以下</option>
                <option value="50k-100k" data-i18n="salary50kTo100k">年薪：5–10 万美元</option>
                <option value="100k-150k" data-i18n="salary100kTo150k">年薪：10–15 万美元</option>
                <option value="150k-plus" data-i18n="salary150kPlus">年薪：15 万美元以上</option>
                <option value="negotiable" data-i18n="salaryNegotiable">薪资：面议</option>
              </select>
              <svg width="11" height="7" viewBox="0 0 11 7" fill="none" aria-hidden="true">
                <path d="m1 1 4.5 4.5L10 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </label>

            <label class="filter-select" for="jobTypeFilter">
              <span class="sr-only" data-i18n="jobTypeLabel">按职位类型筛选</span>
              <select id="jobTypeFilter" name="jobType">
                <option value="all" data-i18n="jobTypeAll">职位类型：全部</option>
                <option value="full-time" data-i18n="fullTime">职位类型：全职</option>
                <option value="part-time" data-i18n="partTime">职位类型：兼职</option>
                <option value="internship" data-i18n="internship">职位类型：实习</option>
              </select>
              <svg width="11" height="7" viewBox="0 0 11 7" fill="none" aria-hidden="true">
                <path d="m1 1 4.5 4.5L10 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </label>

            <button class="clear-button" id="clearFilters" type="button" disabled>
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M3 3 11 11M11 3 3 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
              </svg>
              <span data-i18n="clearFilters">清除筛选</span>
            </button>
          </div>
        </div>

        <div class="table-scroll">
          <table>
            <colgroup>
              <col class="col-job">
              <col class="col-company">
              <col class="col-workplace">
              <col class="col-job-type">
              <col class="col-salary">
              <col class="col-action">
            </colgroup>
            <thead>
              <tr>
                <th scope="col" data-i18n="tableJob">岗位名称</th>
                <th scope="col" data-i18n="tableCompany">公司</th>
                <th scope="col" data-i18n="tableWorkplace">办公模式</th>
                <th scope="col" data-i18n="tableJobType">职位类型</th>
                <th scope="col" data-i18n="tableSalary">薪资</th>
                <th scope="col" class="align-right" data-i18n="tableAction">操作</th>
              </tr>
            </thead>
            <tbody id="jobRows"></tbody>
          </table>
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <span class="empty-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"></circle>
              <path d="m15.4 15.4 4.1 4.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </span>
          <strong data-i18n="emptyTitle">没有找到匹配的岗位</strong>
          <p data-i18n="emptyDescription">换一个关键词，或调整筛选条件。</p>
          <button type="button" id="resetFilters" data-i18n="clearFilters">清除筛选</button>
        </div>
      </section>

      <footer class="site-footer">
        <p>
          <span class="footer-mark" aria-hidden="true">↗</span>
          <span data-i18n="footerNote">岗位信息为演示数据，请以原始招聘页面为准</span>
        </p>
        <p class="footer-brand">ROLEPORT · 2026</p>
      </footer>
    </main>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" hidden>
    <aside class="job-drawer" id="jobDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer-header">
        <span class="drawer-kicker" data-i18n="jobDetails">岗位详情</span>
        <div class="drawer-header-actions">
          <button class="icon-button" id="shareJob" type="button" aria-label="分享岗位" data-i18n-aria="shareJob">
            <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle cx="4" cy="9" r="2.1" stroke="currentColor" stroke-width="1.3"></circle>
              <circle cx="13.5" cy="4" r="2.1" stroke="currentColor" stroke-width="1.3"></circle>
              <circle cx="13.5" cy="14" r="2.1" stroke="currentColor" stroke-width="1.3"></circle>
              <path d="m5.9 8 5.7-2.9M5.9 10l5.7 2.9" stroke="currentColor" stroke-width="1.3"></path>
            </svg>
          </button>
          <button class="icon-button" id="closeDrawer" type="button" aria-label="关闭岗位详情" data-i18n-aria="closeJobDetails">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m4 4 10 10M14 4 4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
      </header>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
  </div>

  <div class="toast" id="copyToast" role="status" aria-live="polite"></div>

  <script src="jobs.js"></script>
  <script src="app.js"></script>
</body>
</html>
