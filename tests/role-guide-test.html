<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roleport · 岗位指南数据检查</title>
<style>:root{--bg:#f5f5f1;--card:#fff;--line:#e4e5df;--text:#171916;--muted:#666b63;--green:#277444;--greenBg:#eaf7ee;--red:#a04d49;--redBg:#fff0ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto;padding:38px 0 60px}.eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em}h1{margin:12px 0 8px;font-size:32px}p{color:var(--muted);font-size:13px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 16px}.stat,.panel{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:8px;font-size:23px}table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{background:#fafaf8;color:var(--muted);font-size:11px}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:700}.pass{background:var(--greenBg);color:var(--green)}.fail{background:var(--redBg);color:var(--red)}.detail{color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}th:nth-child(2),td:nth-child(2){display:none}}</style></head>
<body><main class="wrap"><div class="eyebrow">ROLEPORT / ROLE GUIDE VALIDATION</div><h1>岗位指南数据检查</h1><p>检查 role-guides.js 的必填字段、岗位分类、中英文内容、搜索词和重复数据。全部通过后再刷新找机会页面。</p><section class="stats"><div class="stat"><span>岗位方向</span><strong id="total">—</strong></div><div class="stat"><span>通过</span><strong id="passed">—</strong></div><div class="stat"><span>失败</span><strong id="failed">—</strong></div><div class="stat"><span>状态</span><strong id="state">—</strong></div></section><section class="panel"><table><thead><tr><th>检查项</th><th>状态</th><th>详情</th></tr></thead><tbody id="results"></tbody></table></section></main>
<script src="../role-guides.js?v=20261028.1"></script><script>
(()=>{const data=Array.isArray(window.ROLEPORT_ROLE_GUIDES)?window.ROLEPORT_ROLE_GUIDES:[];const categories=['operations','business','product','engineering','data','design'];const tests=[];const add=(name,ok,detail)=>tests.push({name,ok,detail});const required=['id','category'];const missing=data.filter(g=>required.some(k=>!String(g[k]||'').trim())||!g.name?.zh||!g.name?.en||!g.tagline?.zh||!g.tagline?.en);const ids=data.map(g=>g.id);const duplicateIds=[...new Set(ids.filter((v,i)=>ids.indexOf(v)!==i))];const validLists=data.every(g=>['zh','en'].every(lang=>Array.isArray(g.work?.[lang])&&g.work[lang].length>=3&&Array.isArray(g.prepare?.[lang])&&g.prepare[lang].length>=3&&Array.isArray(g.keywords?.[lang])&&g.keywords[lang].length>=3&&Array.isArray(g.related?.[lang])&&g.related[lang].length>=1));const shortKeywords=data.filter(g=>!['zh','en'].every(lang=>Array.isArray(g.keywords?.[lang])&&g.keywords[lang].length>=3));const emptyCategories=categories.filter(category=>!data.some(g=>g.category===category));add('岗位指南可加载',data.length>0,data.length+' 个岗位方向');add('必填字段完整',!missing.length,missing.length?missing.map(g=>g.id).join(', '):'名称与一句话介绍均为中英双语');add('ID 唯一',!duplicateIds.length,duplicateIds.join(', ')||'无重复');add('分类合法',data.every(g=>categories.includes(g.category)),data.filter(g=>!categories.includes(g.category)).map(g=>g.id).join(', ')||'全部分类合法');add('分类均有内容',!emptyCategories.length,emptyCategories.join(', ')||'每个分类至少有一个岗位方向');add('中英文列表完整',validLists,validLists?'工作内容、准备建议、搜索词与相近岗位均完整':'存在缺少中英文内容的记录');add('搜索词数量充足',!shortKeywords.length,shortKeywords.length?shortKeywords.map(g=>g.id).join(', '):'每个方向至少有 3 个中英文搜索词');add('岗位标题中英双语',data.every(g=>g.name?.zh&&g.name?.en),'岗位名称均提供中文与英文');add('相近岗位已填写',data.every(g=>g.related?.zh?.length&&g.related?.en?.length),'相近岗位均提供中文与英文');const passed=tests.filter(t=>t.ok).length;document.getElementById('results').innerHTML=tests.map(t=>'<tr><td>'+t.name+'</td><td><span class="badge '+(t.ok?'pass':'fail')+'">'+(t.ok?'通过':'失败')+'</span></td><td class="detail">'+t.detail+'</td></tr>').join('');document.getElementById('total').textContent=data.length;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=tests.length-passed;document.getElementById('state').textContent=passed===tests.length?'全部通过':'存在失败';})();
</script></body></html>
