<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roleport · 资源数据检查</title>
<style>:root{--bg:#f5f5f1;--card:#fff;--line:#e4e5df;--text:#171916;--muted:#74766f;--green:#277444;--greenBg:#eaf7ee;--red:#a04d49;--redBg:#fff0ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto;padding:38px 0 60px}.eyebrow{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.1em}h1{margin:12px 0 8px;font-size:32px}p{color:var(--muted);font-size:12px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 16px}.stat,.panel{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.stat span{display:block;color:var(--muted);font-size:9.5px}.stat strong{display:block;margin-top:8px;font-size:23px}table{width:100%;border-collapse:collapse;margin-top:0}th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;font-size:10.5px}th{background:#fafaf8;color:var(--muted);font-size:9px}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:3px 7px;border-radius:10px;font-size:8.5px;font-weight:700}.pass{background:var(--greenBg);color:var(--green)}.fail{background:var(--redBg);color:var(--red)}.detail{color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}th:nth-child(2),td:nth-child(2){display:none}}</style></head>
<body><main class="wrap"><div class="eyebrow">ROLEPORT / RESOURCE VALIDATION</div><h1>资源数据检查</h1><p>检查 resources.js 的必填字段、分类、语言、地区、重复链接和异常数据。全部通过后再刷新正式网站。</p><section class="stats"><div class="stat"><span>资源总数</span><strong id="total">—</strong></div><div class="stat"><span>通过</span><strong id="passed">—</strong></div><div class="stat"><span>失败</span><strong id="failed">—</strong></div><div class="stat"><span>状态</span><strong id="state">—</strong></div></section><section class="panel"><table><thead><tr><th>检查项</th><th>状态</th><th>详情</th></tr></thead><tbody id="results"></tbody></table></section></main>
<script src="../resources.js?v=20261024.1"></script><script>
(()=>{const data=Array.isArray(window.ROLEPORT_RESOURCES)?window.ROLEPORT_RESOURCES:[];const categories=['general','tech','web3','remote','freelance','community','resume','learning'];const languages=['zh','en','bilingual'];const regions=['cn','global','remote'];const tests=[];const add=(name,ok,detail)=>tests.push({name,ok,detail});const required=['id','name','domain','url','category','language','region','letter','tone'];const missing=data.filter(r=>required.some(k=>!String(r[k]||'').trim())||!r.desc?.zh||!r.desc?.en);const ids=data.map(r=>r.id);const urls=data.map(r=>r.url.toLowerCase());const duplicates=(list)=>[...new Set(list.filter((v,i)=>list.indexOf(v)!==i))];add('资源可加载',data.length>0,data.length+' 条正式资源');add('必填字段完整',!missing.length,missing.length?missing.map(r=>r.name).join(', '):'全部字段完整');add('ID 唯一',!duplicates(ids).length,duplicates(ids).join(', ')||'无重复');add('链接唯一',!duplicates(urls).length,duplicates(urls).join(', ')||'无重复');add('HTTPS 链接',data.every(r=>/^https:\/\//.test(r.url)),data.filter(r=>!/^https:\/\//.test(r.url)).map(r=>r.name).join(', ')||'全部使用 HTTPS');add('分类合法',data.every(r=>categories.includes(r.category)),data.filter(r=>!categories.includes(r.category)).map(r=>r.name).join(', ')||'分类合法');const badSecondary=data.filter(r=>(r.secondaryCategories||[]).some(c=>!categories.includes(c)||c===r.category));add('辅助分类合法',!badSecondary.length,badSecondary.length?badSecondary.map(r=>r.name).join(', '):'辅助分类均合法且不与主分类重复');add('语言合法',data.every(r=>languages.includes(r.language)),data.filter(r=>!languages.includes(r.language)).map(r=>r.name).join(', ')||'语言合法');add('地区合法',data.every(r=>regions.includes(r.region)),data.filter(r=>!regions.includes(r.region)).map(r=>r.name).join(', ')||'地区合法');const passed=tests.filter(t=>t.ok).length;document.getElementById('results').innerHTML=tests.map(t=>'<tr><td>'+t.name+'</td><td><span class="badge '+(t.ok?'pass':'fail')+'">'+(t.ok?'通过':'失败')+'</span></td><td class="detail">'+t.detail+'</td></tr>').join('');document.getElementById('total').textContent=data.length;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=tests.length-passed;document.getElementById('state').textContent=passed===tests.length?'全部通过':'存在失败';})();
</script></body></html>
